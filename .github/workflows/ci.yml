name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes during review
# don't queue up redundant full CI passes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------
  # No database, no Redis, no network needed for any of these three --
  # kept as their own fast job so a formatting typo fails in seconds,
  # not after waiting for Postgres to boot.
  # --------------------------------------------------------------------
  lint:
    name: Rust formatting + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Generated API docs are not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Needs no database, no Redis, no running server -- both artifacts
      # are derived from types, not a live app. See docs/commands.md.
      - name: make docs-api-check
        run: make docs-api-check

  frontend:
    name: Admin frontend typecheck/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

     
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path:  apps/admin/package-lock.json

      - name: Install deps
        run: cd admin && npm ci

      - name: Typecheck / build
        run: cd admin && npm run build

  # --------------------------------------------------------------------
  # Everything below needs a real Postgres (and Redis, for some tests),
  # so they share one set of service containers rather than each paying
  # startup cost separately. Each check is still its own named step, so
  # a failure is attributable to a specific requirement in the Actions UI
  # even though they run in one job.
  # --------------------------------------------------------------------
  db-checks:
    name: Tests, Atlas migration check, Cornucopia staleness check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 132456
          POSTGRES_DB: ahlan-commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:132456@127.0.0.1:5432/ahlan-commerce?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      # This job's Postgres service container IS a real database, so the
      # Atlas check runs for real here -- the manual-fallback allowance
      # in the CI contract is for runners where a service container isn't
      # available at all, which is not the case for GitHub-hosted runners.
      # If this step is ever removed in favor of the documented fallback,
      # that change and its reason belong in docs/deployment.md, not a
      # silent CI edit.
      - name: Atlas migration check
        run: atlas migrate apply --url "$DATABASE_URL" --dir "file://db/migrations?format=flyway"

      - name: Cornucopia regeneration check
        run: |
          make cornucopia-generate
          if ! git diff --exit-code -- packages/catalog-db/generated; then
            echo ""
            echo "ERROR: packages/catalog-db/generated is stale."
            echo "A query file changed but 'make cornucopia-generate' was not"
            echo "re-run and committed. Run it locally and commit the result."
            exit 1
          fi

      - name: Rust unit tests
        run: cargo test --workspace --lib --bins

      - name: Rust integration tests
        run: cargo test --workspace --tests