[workspace]
members = ["apps/api","apps/import-worker", "packages/storefront","packages/cache","packages/catalog","packages/catalog-db"]
resolver = "2"


[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rootcause = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "util","cors"] }
tower = "0.5"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
cornucopia = "1"
async-graphql = "7"
async-graphql-axum = "7"
redis = { version = "1", features = ["tokio-comp"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }